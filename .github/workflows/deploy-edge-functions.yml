name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "edge-functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Arrange functions into Supabase layout
        run: |
          mkdir -p supabase/functions/_shared
          cp edge-functions/_shared/*.ts supabase/functions/_shared/
          for f in edge-functions/*.ts; do
            name=$(basename "$f" .ts)
            mkdir -p "supabase/functions/$name"
            cp "$f" "supabase/functions/$name/index.ts"
          done
          ls supabase/functions
      - name: Deploy all edge functions
        run: supabase functions deploy --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
